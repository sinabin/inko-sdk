name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (must equal v<package version>)
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: inko-public-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'sinabin/inko-sdk'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      INKO_PUBLIC_RELEASE: 'true'

    steps:
      - name: Check out the requested tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.14'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use a provenance-capable npm CLI
        run: npm install --global npm@11.6.2

      - name: Verify tag and package version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$VERSION"
          test "$(git tag --points-at HEAD --list "$RELEASE_TAG")" = "$RELEASE_TAG"

      - name: Install locked dependencies
        run: npm ci

      - name: Verify public-source boundary
        shell: bash
        run: |
          PUBLIC_EXPORT="$RUNNER_TEMP/inko-public-source"
          test ! -e "$PUBLIC_EXPORT"
          node scripts/release/export-public-source.mjs "$PUBLIC_EXPORT"
          if [ "$GITHUB_REPOSITORY" != "sinabin/Inko" ]; then
            node scripts/release/verify-public-tree.mjs
          fi

      - name: Scan full history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

      - name: Audit high-severity dependency findings
        run: |
          npm audit --audit-level=high
          npm audit signatures

      - name: Run unit and static checks
        run: |
          npm run test:coverage
          npm run check

      - name: Verify reproducible production build
        shell: bash
        run: |
          npm run build
          node scripts/release/hash-tree.mjs dist > dist-first.sha256
          rm -rf dist
          npm run build
          node scripts/release/hash-tree.mjs dist > dist-second.sha256
          diff -u dist-first.sha256 dist-second.sha256

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser E2E regression suite
        env:
          # 교차 origin 검증은 배포 전용 allowlist를 주입하므로 공개 산출물 빌드와 분리.
          INKO_PUBLIC_RELEASE: 'false'
        run: npm run test:e2e

      - name: Run production-build browser E2E regression suite
        env:
          # 교차 origin 시나리오용 allowlist를 주입한 최적화 build를 별도로 검증한다.
          INKO_PUBLIC_RELEASE: 'false'
        run: npm run test:e2e:production

      - name: Run cross-browser accessibility gate
        env:
          INKO_PUBLIC_RELEASE: 'false'
        run: npm run test:a11y

      - name: Run 120-page performance regression gate
        run: npm run test:perf

      - name: Build and verify release package
        run: |
          npm run build:pkg
          node scripts/release/verify-release-package.mjs release
          npm pack --dry-run --json ./release > npm-pack-dry-run.json

      - name: Locate the single release archive
        id: artifact
        shell: bash
        run: |
          mapfile -t ARCHIVES < <(find . -maxdepth 1 -type f -name '*.tgz' -printf '%f\n')
          test "${#ARCHIVES[@]}" -eq 1
          echo "tarball=${ARCHIVES[0]}" >> "$GITHUB_OUTPUT"
          echo "sbom=inko-${RELEASE_TAG}.sbom.cdx.json" >> "$GITHUB_OUTPUT"

      - name: Verify clean installation and browser round trip
        run: >-
          node tests/release/verify-installed-tarball.mjs
          "${{ steps.artifact.outputs.tarball }}"
          --expect-public

      - name: Generate SBOM and checksums
        shell: bash
        env:
          TARBALL: ${{ steps.artifact.outputs.tarball }}
          SBOM: ${{ steps.artifact.outputs.sbom }}
        run: |
          node scripts/release/generate-artifact-sbom.mjs "$TARBALL" "$SBOM"
          node scripts/release/generate-artifact-sbom.mjs "$TARBALL" "$RUNNER_TEMP/sbom-second.cdx.json"
          cmp "$SBOM" "$RUNNER_TEMP/sbom-second.cdx.json"
          sha256sum "$TARBALL" "$SBOM" > SHA256SUMS

      - name: Attest package build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ steps.artifact.outputs.tarball }}

      - name: Attest package SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
        with:
          subject-path: ${{ steps.artifact.outputs.tarball }}
          sbom-path: ${{ steps.artifact.outputs.sbom }}

      - name: Check whether this version is already on npm
        id: npm_state
        shell: bash
        env:
          TARBALL: ${{ steps.artifact.outputs.tarball }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          LOCAL_INTEGRITY="$(node -e "const fs=require('node:fs'); const crypto=require('node:crypto'); process.stdout.write('sha512-'+crypto.createHash('sha512').update(fs.readFileSync(process.argv[1])).digest('base64'))" "$TARBALL")"
          if REMOTE_INTEGRITY="$(npm view "inko-pdf-sdk@$VERSION" dist.integrity 2>/dev/null)"; then
            if [ "$REMOTE_INTEGRITY" != "$LOCAL_INTEGRITY" ]; then
              echo "npm already contains inko-pdf-sdk@$VERSION with different bytes" >&2
              exit 1
            fi
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package to npm with provenance
        if: steps.npm_state.outputs.published != 'true'
        run: npm publish "${{ steps.artifact.outputs.tarball }}" --access public --provenance

      - name: Create or refresh GitHub release from the same artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.artifact.outputs.tarball }}
          SBOM: ${{ steps.artifact.outputs.sbom }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "$TARBALL" "$SBOM" SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$TARBALL" "$SBOM" SHA256SUMS \
              --verify-tag \
              --title "Inko $RELEASE_TAG" \
              --generate-notes
          fi

      - name: Preserve release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: inko-release-${{ env.RELEASE_TAG }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            *.tgz
            *.sbom.cdx.json
            SHA256SUMS
            dist-first.sha256
            dist-second.sha256
            npm-pack-dry-run.json
            coverage/
            test-results/performance/
            node_modules/.cache/inko-playwright-development/report/
            node_modules/.cache/inko-playwright-development/results/
            node_modules/.cache/inko-playwright-production/report/
            node_modules/.cache/inko-playwright-production/results/
            node_modules/.cache/inko-playwright-accessibility/report/
            node_modules/.cache/inko-playwright-accessibility/results/
