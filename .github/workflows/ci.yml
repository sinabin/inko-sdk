name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.14'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify public-source boundary
        shell: bash
        run: |
          PUBLIC_EXPORT="$RUNNER_TEMP/inko-public-source"
          test ! -e "$PUBLIC_EXPORT"
          node scripts/release/export-public-source.mjs "$PUBLIC_EXPORT"
          if ! git ls-files --error-unmatch CLAUDE.md >/dev/null 2>&1; then
            node scripts/release/verify-public-tree.mjs
          fi

      - name: Scan full history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

      - name: Audit high-severity dependency findings
        run: |
          npm audit --audit-level=high
          npm audit signatures

      - name: Run unit tests with coverage gates
        run: npm run test:coverage

      - name: Run static checks
        run: npm run check

      - name: Verify reproducible production build
        shell: bash
        env:
          INKO_PUBLIC_RELEASE: 'true'
        run: |
          npm run build
          node scripts/release/hash-tree.mjs dist > dist-first.sha256
          rm -rf dist
          npm run build
          node scripts/release/hash-tree.mjs dist > dist-second.sha256
          diff -u dist-first.sha256 dist-second.sha256

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser E2E regression suite
        run: npm run test:e2e

      - name: Run production-build browser E2E regression suite
        run: npm run test:e2e:production

      - name: Run cross-browser accessibility gate
        run: npm run test:a11y

      - name: Run 120-page performance regression gate
        run: npm run test:perf

      - name: Build and verify npm release candidate
        shell: bash
        env:
          INKO_PUBLIC_RELEASE: 'true'
        run: |
          npm run build:pkg
          node scripts/release/verify-release-package.mjs release
          mapfile -t ARCHIVES < <(find . -maxdepth 1 -type f -name '*.tgz' -printf '%f\n')
          test "${#ARCHIVES[@]}" -eq 1
          node tests/release/verify-installed-tarball.mjs "${ARCHIVES[0]}" --expect-public
          npm pack --dry-run --json ./release > npm-pack-dry-run.json

      - name: Generate and verify artifact CycloneDX SBOM
        shell: bash
        run: |
          mapfile -t ARCHIVES < <(find . -maxdepth 1 -type f -name '*.tgz' -printf '%f\n')
          test "${#ARCHIVES[@]}" -eq 1
          node scripts/release/generate-artifact-sbom.mjs "${ARCHIVES[0]}" sbom.cdx.json
          node scripts/release/generate-artifact-sbom.mjs "${ARCHIVES[0]}" "$RUNNER_TEMP/sbom-second.cdx.json"
          cmp sbom.cdx.json "$RUNNER_TEMP/sbom-second.cdx.json"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: inko-ci-evidence-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            dist-first.sha256
            dist-second.sha256
            npm-pack-dry-run.json
            sbom.cdx.json
            coverage/
            test-results/performance/
            node_modules/.cache/inko-playwright-development/report/
            node_modules/.cache/inko-playwright-development/results/
            node_modules/.cache/inko-playwright-production/report/
            node_modules/.cache/inko-playwright-production/results/
            node_modules/.cache/inko-playwright-accessibility/report/
            node_modules/.cache/inko-playwright-accessibility/results/
